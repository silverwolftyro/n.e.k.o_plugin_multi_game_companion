# =============================================================================
# terms/genshin/characters.toml —— 原神 · 角色
# -----------------------------------------------------------------------------
# 角色条目不进语境块，只在 lookup_game_term 被调用时按需返回。
# 因此可以写得比 core.toml 详细一些（但 brief 仍建议 ≤80 字）。
#
# ⚠️ TODO(verify): 以下条目为结构示例，需由熟悉原神的同事校对后再上线；
#    尤其是「元素 + 武器类型」这两项，写错会直接暴露。
# =============================================================================

[terms."雷电将军"]
kind = "角色"
brief = "雷元素单手剑角色，靠元素爆发提供雷附着与全队增伤。"
aliases = ["雷神", "影", "Raiden Shogun"]
slang = ["雷神劈了", "开大"]
avoid = "不要写成『雷电将军是法师』——她使用单手剑"
# TODO(verify): 增伤机制的准确表述与当前版本强度定位

[terms."钟离"]
kind = "角色"
brief = "岩元素长枪角色，以护盾与减抗见长。"
aliases = ["岩王帝君", "帝君", "Zhongli"]
slang = ["钟离盾"]
# TODO(verify): 护盾与减抗的具体数值口径

[terms."胡桃"]
kind = "角色"
brief = "火元素长枪角色，以低血量高爆发著称。"
aliases = ["Hu Tao"]
