# =============================================================================
# terms/genshin/characters.toml —— 原神 · 角色
# -----------------------------------------------------------------------------
# 生成源：miao-plugin resources/meta-gs/character/data.json（125 名角色，含 3 名主角）
# 字段来源（逐字段可追溯，无人工猜测）：
#   key     = data.json 的 name
#   kind    = 固定 "角色"
#   brief   = elem + weapon 直译（pyro→火 … anemo→风；sword→单手剑 … polearm→长枪）
#   aliases = data.json 的 abbr（仅当 abbr ≠ name）+ 七神称号
#   slang/avoid = 脚手架阶段已人工校对的内容，原样保留
#
# 选取规则（38 条）：
#   5★ 23 条 = 七神 6 位必收 + 其余按上线时间（eta）从早到晚补齐
#              + 1 处人工替换：八重神子 替换 埃洛伊（2026-09-25 按用户决定）
#   4★ 12 条 = 上线时间最早的 12 位（开服四星即家喻户晓那批）
#   主角 3 条 = 空／荧／旅行者：elem = multi 写不出单一元素，
#              不套用 elem+weapon 模板，用通用描述单列在文件末尾
#   ⚠️ 「上线早」只是资历/知名度的代理指标，不是实测人气；若有人气数据请替换。
#
# 角色条目不进语境块，只在 lookup_game_term 被调用时按需返回。
# =============================================================================

[terms."温迪"]
kind = "角色"
brief = "风元素弓角色"
aliases = ["风神"]

