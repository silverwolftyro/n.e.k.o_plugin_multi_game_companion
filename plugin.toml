# =============================================================================
# multi_game_companion — 多游戏通用陪聊（L1 MVP）
# -----------------------------------------------------------------------------
# 范围：仅做四件事
#   ① 用户/模型声明"我现在在玩 XX 游戏"
#   ② 声明后加载该游戏的术语库
#   ③ 陪聊时把术语库注入宿主 LLM 上下文（推小块 + 拉单条）
#   ④ 切换游戏时卸载旧术语索引、加载新术语索引
#
# 明确不做：游戏检测 / 动作操作 / 决策层 / 主动搭话调度 / 自建 LLM 调用
#
# 与 KB 的关系：
#   - 只用 type = "plugin"（默认），不写 type = "extension"，不写 [plugin.host]
#   - 不声明 [plugin.database] / [plugin_state] / [plugin.install]
#   - 自定义配置放顶层 [multi_game_companion] 与 [games.*]（KB W6 认可自定义段）
#   - 不往 [plugin] 里塞平台不认识的键
# =============================================================================

[plugin]
id = "multi_game_companion"
name = "多游戏陪玩"
type = "plugin"

description = "陪伴你玩多款游戏：登记当前在玩的游戏后，自动切换到对应的游戏语境与术语库，用正确的术语陪聊、解闷、哄人。支持原神、鸣潮等；也可以由猫娘在对话里识别并登记。不读取游戏数据、不修改游戏、不做任何自动化操作。"

short_description = "Multi-game companion: switch game context and terminology on demand."

# keywords 是正则片段，命中后并入 Agent Stage 1 候选集（不绕过 Stage 2，也不保证执行）。
# 全部为纯文字，不含正则元字符，避免误匹配或解析异常。
keywords = [
    "原神",
    "鸣潮",
    "崩坏",
    "星穹铁道",
    "绝区零",
    "陪玩",
    "陪聊",
    "游戏术语",
    "genshin",
    "wuthering",
]

version = "2.0.0"
entry = "plugin.plugins.multi_game_companion:MultiGameCompanionPlugin"

[plugin.author]
# TODO: 填写作者名（可选，显示在插件管理器）
name = "TODO"

# -----------------------------------------------------------------------------
# SDK 版本窗口
# recommended 是"最佳测试范围"，比 supported 更窄是正常的，不是矛盾。
# 取值沿用 docs/plugins/plugin-toml.md 的官方示例。
# -----------------------------------------------------------------------------
[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

# -----------------------------------------------------------------------------
# 插件本地 i18n —— 必须显式声明
# （sts2 漏声明 [plugin.i18n] 靠 locales_dir 默认值侥幸生效，本插件不重犯）
# -----------------------------------------------------------------------------
[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

# -----------------------------------------------------------------------------
# 持久化 KV —— 存 current_game / last_switched_at
# 必须显式 enabled = true，否则 self.store 处于禁用态。
# -----------------------------------------------------------------------------
[plugin.store]
enabled = true

# -----------------------------------------------------------------------------
# 运行时
# auto_start = false → 手动启动（不是"禁用"，也不代表 import 安全；
#   本插件的模块顶层无任何副作用）。
# 刻意不写 timeout：走系统默认，避免 0 < timeout <= 300 的边界约束成为负担。
# -----------------------------------------------------------------------------
[plugin_runtime]
enabled = true
auto_start = false

# -----------------------------------------------------------------------------
# UI —— 只做一个只读 Markdown 快速开始，不做 Hosted TSX 面板
# guide 不读 Python 状态，因此刻意不写 context（避免要求一个不存在的
# @ui.context provider）；permissions 保持文档化的 guide 默认值。
# -----------------------------------------------------------------------------
[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "快速开始"
entry = "docs/quickstart.md"
permissions = ["state:read"]


# =============================================================================
# 自定义段 1：MVP 可调项
# -----------------------------------------------------------------------------
# ⚠️ 每个键都必须被代码真正读取，并有一个"改了它行为就变"的测试。
#    （直接针对 sts2 那 14 个"清单里声明、代码里零命中"的死配置键教训）
# =============================================================================

[multi_game_companion]
# 未登记任何游戏时的兜底 game_id；空字符串 = 无兜底（首次使用必须显式声明）
default_game = ""

# 启动时从 self.store 恢复上次登记的游戏
auto_restore_last_game = true

# 语境块里自动携带的术语条数上限（从 core.toml + slang.toml 中选取）
context_inject_max_terms = 5

# 语境块字符数硬上限（push_message 的 payload 上限是 512 KiB，这里留三个数量级余量）
max_context_chars = 800

# lookup_game_term 每次最多返回的匹配条数
lookup_max_matches = 3

# lookup_game_term 每条术语返回的字符上限（brief + slang 截断到该长度）
lookup_max_chars_per_term = 200

# P1：每 N 条用户消息重推一次语境块，解决长会话中语境被挤出上下文窗口。
# 0 = 关闭（MVP 默认关闭）
reinject_every_n_messages = 0


# =============================================================================
# 自定义段 2：游戏注册表
# -----------------------------------------------------------------------------
# 设计约定（重要，避免身份与内容重复定义）：
#   - 本段是"身份真源"：game_id / display_name / aliases / terms_dir / enabled
#     必须在读任何术语文件之前就能解析，供声明的模糊匹配使用。
#   - 术语包里的 core.toml [game] 只管"内容"（tone / notes），不重复身份字段。
#
# 每个 [games.<game_id>] 的字段：
#   display_name   必填  注入语境块时使用的正式名
#   aliases        必填  字符串数组，声明的模糊匹配依据
#   terms_dir      可选  相对 plugin_dir 的术语包目录，默认 terms/<game_id>
#   enabled        可选  默认 true；false 可临时下架而不删文件
#   context_terms  可选  强制常驻语境块的术语 key 列表；缺省则按 context_inject_max_terms 自动选取
#
# 用户可通过运行配置（<用户数据>/plugins/multi_game_companion/config/plugin.toml）
# 覆盖或新增游戏，无需改动本清单。
# =============================================================================

[games.genshin]
display_name = "原神"
aliases = ["原神", "Genshin", "Genshin Impact", "genshin"]
terms_dir = "terms/genshin"
enabled = true
# context_terms = ["元素反应", "深境螺旋", "抽卡"]   # 可选：覆盖自动选取

[games.wuthering_waves]
display_name = "鸣潮"
aliases = ["鸣潮", "Wuthering Waves", "WuWa", "wuthering"]
terms_dir = "terms/wuthering_waves"
enabled = true
# context_terms = ["共鸣者", "声骸", "数据坞"]       # 可选：覆盖自动选取

